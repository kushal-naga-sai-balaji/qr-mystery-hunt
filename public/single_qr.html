<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkpoint QR | The Chronos Protocol</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }
    .single-qr-wrapper {
      max-width: 520px;
      width: 100%;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 1.5rem;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,0.6);
    }
    .stage-nav {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .stage-nav-btn {
      padding: 0.4rem 0.8rem;
      border-radius: 0.35rem;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .stage-nav-btn.active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      font-weight: bold;
    }
    .qr-frame {
      background: #ffffff;
      padding: 1.25rem;
      border-radius: 1rem;
      display: inline-block;
      margin: 1.25rem 0;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }
    .qr-frame img {
      width: 280px;
      height: 280px;
      display: block;
      aspect-ratio: 1/1;
    }
    @media print {
      body {
        background: #fff !important;
        padding: 0 !important;
        display: block !important;
      }
      .no-print {
        display: none !important;
      }
      .single-qr-wrapper {
        border: none !important;
        box-shadow: none !important;
        max-width: 100% !important;
        padding: 3rem !important;
      }
      .qr-frame {
        box-shadow: none !important;
        border: 2px solid #000 !important;
      }
      .qr-frame img {
        width: 380px !important;
        height: 380px !important;
      }
    }
  </style>
</head>
<body>
  <div class="single-qr-wrapper">
    <!-- Stage Selector Pills (Single QR navigation) -->
    <div class="stage-nav no-print">
      <a href="/qr/1" class="stage-nav-btn" id="pill1">QR 1</a>
      <a href="/qr/2" class="stage-nav-btn" id="pill2">QR 2</a>
      <a href="/qr/3" class="stage-nav-btn" id="pill3">QR 3</a>
      <a href="/qr/4" class="stage-nav-btn" id="pill4">QR 4</a>
      <a href="/qr/5" class="stage-nav-btn" id="pill5">QR 5</a>
    </div>

    <!-- Header info -->
    <div>
      <span class="stage-badge" id="lblStageBadge">CHECKPOINT 01 OF 05</span>
      <h1 id="lblStageTitle" style="font-size: 1.6rem; margin-top: 0.5rem; color: #fff;">Loading...</h1>
      <p id="lblLocation" style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem;"></p>
    </div>

    <!-- The Pure Single QR Code -->
    <div class="qr-frame">
      <img id="imgQr" src="" alt="QR Checkpoint" />
    </div>

    <!-- Stepper (Prev / Next) -->
    <div class="no-print" style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; gap: 0.5rem;">
      <a id="btnPrev" href="#" class="btn btn-secondary btn-sm" style="flex: 1;">◀ Previous QR</a>
      <a id="btnNext" href="#" class="btn btn-secondary btn-sm" style="flex: 1;">Next QR ▶</a>
    </div>

    <!-- Download & Print Actions -->
    <div class="no-print" style="display: flex; gap: 0.5rem; justify-content: center; margin-top: 1rem; flex-wrap: wrap;">
      <a id="btnDlPng" href="#" download class="btn btn-emerald btn-sm">📥 Download PNG</a>
      <a id="btnDlSvg" href="#" download class="btn btn-secondary btn-sm">📥 Download SVG</a>
      <button onclick="window.print()" class="btn btn-secondary btn-sm">🖨️ Print This QR</button>
    </div>

    <div class="no-print" style="margin-top: 1.5rem; border-top: 1px solid var(--border-color); padding-top: 1rem; display: flex; justify-content: space-between; font-size: 0.8rem;">
      <a href="/play" style="color: var(--accent-cyan); text-decoration: none;">🎮 Player Portal</a>
      <a href="/admin" style="color: var(--accent-amber); text-decoration: none;">🛡️ Admin Verifier</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const parts = window.location.pathname.split('/').filter(Boolean);
      let stageId = parseInt(parts[1] || '1', 10);
      if (isNaN(stageId) || stageId < 1 || stageId > 5) stageId = 1;

      // Highlight active pill
      document.querySelectorAll('.stage-nav-btn').forEach(btn => btn.classList.remove('active'));
      const activePill = document.getElementById(`pill${stageId}`);
      if (activePill) activePill.classList.add('active');

      try {
        const [manRes, infoRes] = await Promise.all([
          fetch('/qrs/manifest.json'),
          fetch('/api/game-info')
        ]);
        const manifest = await manRes.json();
        const info = await infoRes.json();

        const stage = manifest.stages.find(s => s.stageId === stageId);
        const stageInfo = info.stages.find(s => s.id === stageId);

        if (!stage) return;

        document.getElementById('lblStageBadge').textContent = `CHECKPOINT 0${stageId} OF 05`;
        document.getElementById('lblStageTitle').textContent = stage.stageName;
        document.getElementById('lblLocation').textContent = stageInfo ? stageInfo.locationClue : '';

        const img = document.getElementById('imgQr');
        img.src = stage.pngUrl;
        img.alt = `QR Stage ${stageId}`;

        // Download links
        const btnPng = document.getElementById('btnDlPng');
        btnPng.href = stage.pngUrl;
        btnPng.download = `QR_Stage_${stageId}.png`;

        const btnSvg = document.getElementById('btnDlSvg');
        btnSvg.href = stage.svgUrl;
        btnSvg.download = `QR_Stage_${stageId}.svg`;

        // Prev & Next buttons
        const prevId = stageId > 1 ? stageId - 1 : 5;
        const nextId = stageId < 5 ? stageId + 1 : 1;
        document.getElementById('btnPrev').href = `/qr/${prevId}`;
        document.getElementById('btnNext').href = `/qr/${nextId}`;

      } catch (e) {
        console.error("Failed to load single QR", e);
      }
    });
  </script>
</body>
</html>
